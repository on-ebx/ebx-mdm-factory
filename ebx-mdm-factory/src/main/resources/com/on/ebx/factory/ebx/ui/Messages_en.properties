mappingMatrix.explain.derived.FOLD_KEY=Matching key: a technical field the matching uses instead of {0} itself, so that "Z\u00FCrich" and "ZURICH" from two systems compare equal. It is computed at load time from the value of {0} (accents stripped, upper case) on every staging row, whichever source wrote it, and is never fed by a source link. {0} itself is never changed. Accept it to give the matching plan this key; reject it and the plan falls back to comparing {0} as is.
mappingMatrix.explain.derived.VALID_VALUE=Computed field: the value of {0} when it passes its own quality rule, empty otherwise, so that survivorship prefers a clean value. Computed at load time on every staging row, never fed by a source link.
mappingMatrix.explain.derived.SCRIPT=Computed field: the result of a published library function applied to {0}. The value is stored in the staging record and kept up to date by EBX when the record is created and whenever {0} changes; it is never fed by a source link.
mappingMatrix.explain.derived.CHILD_KEYS=Computed field: one exact key per {0} record that refers to this one (the chosen {0} attributes, accents stripped, upper case, joined), computed at load time AFTER the {0} records are loaded and never fed by a source link. The matching uses it to find records that share a {0} record without reading the {0} table for every pair.
mappingMatrix.explain.derived.OTHER=Computed field: computed at load time from {0} on every staging row, never fed by a source link.
