engine.external.zoneDatasetDeniedRemoved=MDMF-ZONE-1: ON EBX refused to create the dataset of the zone {0} (the data-model server answered "Tool invocation failed" with no reason). The zone had just been created by the factory and has been removed (it held nothing of its own). Permissions copied at creation: {3}. By default (no -D{1}) the zone copies its parent dataspace, so the refusal then comes from the permissions of that parent itself: give the administrator and the roles what they need on it, or name another dataspace with -D{1}=<key>. With a named dataspace, check that dataspace''s permissions. With -D{1}=none the zone is closed to everyone but its owner administrator: remove the setting or name a dataspace. Restart the server if you changed a setting, and run the step again. The setting applies to NEW zones only.
engine.external.zoneDatasetDeniedKept=MDMF-ZONE-1: ON EBX refused to create the dataset of the zone {0} (the data-model server answered "Tool invocation failed" with no reason). The zone had just been created by the factory and could not be removed ({2}). Delete the zone in the ON EBX dataspaces screen if nothing else uses it. Permissions copied at creation: {3}. By default (no -D{1}) the zone copies its parent dataspace, so the refusal then comes from the permissions of that parent itself: give the administrator and the roles what they need on it, or name another dataspace with -D{1}=<key>. With a named dataspace, check that dataspace''s permissions. With -D{1}=none the zone is closed to everyone but its owner administrator: remove the setting or name a dataspace. Restart the server if you changed a setting, and run the step again; or give the permissions on the zone itself. The setting applies to NEW zones only.
engine.external.zoneDatasetDeniedExisting=MDMF-ZONE-1: ON EBX refused to create the dataset of the zone {0} (the data-model server answered "Tool invocation failed" with no reason). The zone already existed (possibly created by a version before 1.4.3, which copied no permissions by default), so the setting is not applied to it. If it is empty, delete it in the ON EBX dataspaces screen and run the step again, or give the permissions on the zone itself. Permissions copied at creation of new zones: {3}. By default (no -D{1}) a new zone copies its parent dataspace, so a refusal on a new zone would come from the permissions of that parent itself; with a named dataspace (-D{1}=<key>), check that dataspace''s permissions; with -D{1}=none new zones are closed to everyone but their owner administrator.
