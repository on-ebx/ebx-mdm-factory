# 1.4.2 (F3-13) : le style d'un projet
access.style.closed=MDMF-STYLE-1 : le style d'un projet ne se saisit pas ici. Un projet se cr\u00E9e avec l'assistant de projet, dans un style ouvert (Consolidation) ; les autres styles sont bient\u00F4t disponibles. Laissez le champ vide : le style par d\u00E9faut, Consolidation, s'applique.
access.style.fixed=MDMF-STYLE-2 : le style d'un projet est fix\u00E9 \u00E0 sa cr\u00E9ation et ne change plus.
engine.invalid.restoreTooLarge=MDMF-RESTORE-1 : l''archive d\u00E9passe une borne de restauration ({0} = {1}). Refaites la sauvegarde du projet avec ''exclude'' pour les tables volumineuses (Xref, TransferReject, DistributionEvent), ou demandez \u00E0 un administrateur du serveur de relever la borne.
engine.invalid.driftProjectMismatch=La d\u00E9rive de source {0} nomme le projet {1}, qui n''est pas celui de sa table landing : elle ne peut pas \u00EAtre d\u00E9cid\u00E9e ni appliqu\u00E9e. Demandez \u00E0 un administrateur de corriger ou de supprimer la ligne.
engine.external.zoneDatasetDeniedRemoved=MDMF-ZONE-1 : ON EBX a refus\u00E9 de cr\u00E9er le dataset de la zone {0} (le serveur data-model a r\u00E9pondu \u00AB Tool invocation failed \u00BB sans motif). La zone venait d''\u00EAtre cr\u00E9\u00E9e par la Factory et a \u00E9t\u00E9 supprim\u00E9e (elle ne contenait rien qui lui soit propre). Permissions recopi\u00E9es \u00E0 la cr\u00E9ation : {3}. Par d\u00E9faut (sans -D{1}) la zone recopie son dataspace parent : le refus vient alors des permissions de ce parent lui-m\u00EAme ; donnez \u00E0 l''administrateur et aux r\u00F4les ce qu''il leur faut dessus, ou nommez un autre dataspace avec -D{1}=<cl\u00E9>. Avec un dataspace nomm\u00E9, v\u00E9rifiez les permissions de ce dataspace. Avec -D{1}=none la zone est ferm\u00E9e \u00E0 tous sauf \u00E0 son propri\u00E9taire administrator : retirez le r\u00E9glage ou nommez un dataspace. Red\u00E9marrez le serveur si vous avez chang\u00E9 un r\u00E9glage, puis relancez l''\u00E9tape. Le r\u00E9glage ne s''applique qu''aux NOUVELLES zones.
engine.external.zoneDatasetDeniedKept=MDMF-ZONE-1 : ON EBX a refus\u00E9 de cr\u00E9er le dataset de la zone {0} (le serveur data-model a r\u00E9pondu \u00AB Tool invocation failed \u00BB sans motif). La zone venait d''\u00EAtre cr\u00E9\u00E9e par la Factory et n''a pas pu \u00EAtre supprim\u00E9e ({2}). Supprimez la zone dans l''\u00E9cran des dataspaces d''ON EBX si rien d''autre ne l''utilise. Permissions recopi\u00E9es \u00E0 la cr\u00E9ation : {3}. Par d\u00E9faut (sans -D{1}) la zone recopie son dataspace parent : le refus vient alors des permissions de ce parent lui-m\u00EAme ; donnez \u00E0 l''administrateur et aux r\u00F4les ce qu''il leur faut dessus, ou nommez un autre dataspace avec -D{1}=<cl\u00E9>. Avec un dataspace nomm\u00E9, v\u00E9rifiez les permissions de ce dataspace. Avec -D{1}=none la zone est ferm\u00E9e \u00E0 tous sauf \u00E0 son propri\u00E9taire administrator : retirez le r\u00E9glage ou nommez un dataspace. Red\u00E9marrez le serveur si vous avez chang\u00E9 un r\u00E9glage, puis relancez l''\u00E9tape ; ou donnez les permissions sur la zone elle-m\u00EAme. Le r\u00E9glage ne s''applique qu''aux NOUVELLES zones.
engine.external.zoneDatasetDeniedExisting=MDMF-ZONE-1 : ON EBX a refus\u00E9 de cr\u00E9er le dataset de la zone {0} (le serveur data-model a r\u00E9pondu \u00AB Tool invocation failed \u00BB sans motif). La zone existait d\u00E9j\u00E0 (peut-\u00EAtre cr\u00E9\u00E9e par une version ant\u00E9rieure \u00E0 la 1.4.3, qui ne recopiait aucune permission par d\u00E9faut) : le r\u00E9glage ne s''y applique pas. Si elle est vide, supprimez-la dans l''\u00E9cran des dataspaces d''ON EBX et relancez l''\u00E9tape, ou donnez les permissions sur la zone elle-m\u00EAme. Permissions recopi\u00E9es \u00E0 la cr\u00E9ation des zones nouvelles : {3}. Par d\u00E9faut (sans -D{1}) une zone nouvelle recopie son dataspace parent : un refus sur une zone nouvelle viendrait alors des permissions de ce parent ; avec un dataspace nomm\u00E9 (-D{1}=<cl\u00E9>), v\u00E9rifiez ses permissions ; avec -D{1}=none les zones nouvelles sont ferm\u00E9es \u00E0 tous sauf \u00E0 leur propri\u00E9taire administrator.
