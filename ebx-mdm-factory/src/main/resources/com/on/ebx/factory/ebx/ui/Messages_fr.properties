connection.label=Connexion
connection.description=Compte de l'agent, namespace du lineage et connecteur du mod\u00E8le de langage\u00A0; un bouton teste sur ce n\u0153ud chaque serveur n\u00E9cessaire \u00E0 la factory.
connection.title=Connexion
connection.test.button=Tester la connexion
connection.section.title=Identit\u00E9s et droits
connection.section.lead=La factory appelle les serveurs MCP de cette instance sous l'identit\u00E9 de la personne ou du workflow qui agit\u00A0: ebx-connectors dans la JVM, les serveurs d'EBX lui-m\u00EAme (data-model, match-merge, scripting) avec un jeton qu'EBX fabrique pour cet utilisateur. Le compte agent ci-dessous n'est plus qu'un repli, pour un appel sans session ou un EBX o\u00F9 le jeton ne peut pas \u00EAtre fabriqu\u00E9. Le mod\u00E8le de langage a sa propre cl\u00E9, sur son connecteur. La factory trouve elle-m\u00EAme l'adresse de ce n\u0153ud.
connection.field.url=Adresse interne d'EBX (optionnelle)
connection.field.url.hint=Laisser vide\u00A0: la factory appelle ce n\u0153ud lui-m\u00EAme par son propre connecteur Tomcat. Ne la remplir que si cette d\u00E9tection \u00E9choue, avec une adresse de CE n\u0153ud (ex. http://127.0.0.1:8080), jamais l'adresse publique derri\u00E8re un load balancer.
connection.field.user=Utilisateur agent
connection.field.user.hint=L'utilisateur EBX sous lequel tournent toutes les \u00E9tapes de g\u00E9n\u00E9ration et tous les appels d'outils de l'agent. Ce que ce compte peut faire, la factory peut le faire\u00A0: prendre un compte d\u00E9di\u00E9, aux droits minimaux.
connection.field.password=Mot de passe
connection.field.password.hint.target=Cible\u00A0: compte de service d\u00E9di\u00E9 svc-mdm-factory, secret par r\u00E9f\u00E9rence env: / file: / vault:.
connection.field.password.set=Un mot de passe est enregistr\u00E9. Laissez vide pour le conserver.
connection.field.password.unset=Aucun mot de passe enregistr\u00E9 pour l'instant.
connection.field.password.placeholder.set=inchang\u00E9
connection.field.password.placeholder.unset=saisir un mot de passe
connection.field.llm=Connecteur du mod\u00E8le de langage
connection.field.llm.hint=Un connecteur de type llm d'ebx-connectors\u00A0: il porte lui-m\u00EAme son fournisseur, son mod\u00E8le et sa cl\u00E9 d'API. Aucun\u00A0: la factory ne travaille qu'avec ses r\u00E8gles d\u00E9terministes.
connection.test.never=Aucun test lanc\u00E9 pour l'instant.
connection.test.just=R\u00E9sultat du test qui vient de tourner.
connection.results.ok=joignable \u00B7 compte agent accept\u00E9 \u00B7 {0} outils
connection.results.probe.ok=\u00B7 {0} a r\u00E9pondu
connection.results.bad.unknown=Injoignable, raison inconnue.
connection.ready.yes=Pr\u00EAt\u00A0: tous les serveurs n\u00E9cessaires r\u00E9pondent correctement.
connection.ready.no=Pas pr\u00EAt\u00A0: au moins un serveur ne r\u00E9pond pas correctement, voir la ligne ci-dessus.
connection.warning=\u26A0 Ce que ce compte a le droit de faire dans EBX est ce que la factory peut faire\u00A0: dataspaces visibles, droit de publication de mod\u00E8le, configuration Match and Merge des tables du projet. D\u00E9cider (accepter une proposition) reste un geste nominatif dans l'UI\u00A0; ce compte n'a pas le droit de passer une ligne \u00E0 Accept\u00E9e.
