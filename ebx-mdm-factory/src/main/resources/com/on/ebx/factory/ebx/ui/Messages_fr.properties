wizard.step4.llm.disclosure.SHAPES_ONLY=Les m\u00E9tadonn\u00E9es (noms, colonnes, types, cl\u00E9s, \u00E9tiquettes, relations) et la FORME des valeurs les plus fr\u00E9quentes des colonnes texte (chaque lettre en a/A, chaque chiffre en 9 - jamais une vraie valeur) sortent de cette instance pour ce projet. R\u00E9serv\u00E9 aux titulaires du droit MDM Factory DESIGN.
wizard.step4.llm.disclosure.SAMPLE_VALUES=Les m\u00E9tadonn\u00E9es (noms, colonnes, types, cl\u00E9s, \u00E9tiquettes, relations) et un \u00E9chantillon de VRAIES valeurs peuvent sortir de cette instance pour ce projet - le param\u00E8tre de partage des donn\u00E9es de ce projet l'autorise. R\u00E9serv\u00E9 aux titulaires du droit MDM Factory DESIGN.
