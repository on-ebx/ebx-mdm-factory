wizard.step2.title=D'o\u00F9 viennent vos donn\u00E9es ?
wizard.step2.lead=Ajoutez chaque application qui contient les enregistrements que vous voulez unifier, comme votre ERP et votre CRM. La factory lit ce que chacune contient - ses tables et ses colonnes - et la pr\u00E9pare. Vous n'avez jamais besoin d'ouvrir Connectors ni le catalogue de donn\u00E9es.
wizard.step2.noCatalog=Le catalogue de donn\u00E9es n\u2019est pas install\u00E9 sur cette instance : aucune source du catalogue ne peut \u00EAtre choisie.
wizard.catalog.restricted=Votre droit sur le catalogue de donn\u00E9es ne vous permet pas de voir une partie du contenu du catalogue pour ce projet (sources, tables, colonnes, tables trouv\u00E9es \u00E0 partir des donn\u00E9es, data product) : il n'est pas affich\u00E9, et une liste qui para\u00EEt vide ici ne l'est peut-\u00EAtre pas. Voir le catalogue demande le droit CONSUME du catalogue. Un administrateur EBX le donne \u00E0 l'un de vos r\u00F4les dans la table 'Access rights' du catalogue (le r\u00F4le 'CatalogConsumer' l'a par d\u00E9faut).
