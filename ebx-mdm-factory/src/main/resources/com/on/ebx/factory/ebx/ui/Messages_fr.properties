wizard.step3.run.intro.lead=Un clic trouve la cl\u00E9 de chaque table, cr\u00E9e les tables de landing, cr\u00E9e les flux et charge les donn\u00E9es. Une table ne s'arr\u00EAte pour vous que si aucune cl\u00E9 n'est assez certaine.
