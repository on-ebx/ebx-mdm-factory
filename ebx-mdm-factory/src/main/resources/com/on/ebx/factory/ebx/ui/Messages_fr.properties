wizard.step4.lead.greenfield=Vos sources d\u00E9crivent les m\u00EAmes enregistrements avec des noms de colonnes diff\u00E9rents. Dans cette \u00E9tape, la factory propose une structure partag\u00E9e, comment chaque source la remplit, et les r\u00E8gles qui \u00E9cartent les mauvaises donn\u00E9es. Vous relisez la proposition, corrigez ce qui ne va pas, puis chargez les donn\u00E9es.
